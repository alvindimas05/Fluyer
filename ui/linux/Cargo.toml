[package]
name = "fluyer_linux"
version = "0.1.0"
edition = "2021"
description = "Fluyer GTK 4 / libadwaita shell for Linux"

[[bin]]
name = "fluyer"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
fluyer_core = { path = "../../crates/fluyer_core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
